<form action="/stations" method="get" class="search-form">
<div class="search-fields">
  <div class="field"><label for="driver_id">Driver <span class="required">Required</span></label><select id="driver_id" name="driver_id" required><option value="">Choose a driver</option>{% for driver in drivers %}<option value="{{ driver.driver_id }}" {% if filters.get('driver_id')|string == driver.driver_id|string %}selected{% endif %}>{{ driver.name or 'Unnamed driver' }} · {{ driver.licence_number }}</option>{% endfor %}</select></div>
  <div class="field"><label for="vehicle_id">Vehicle <span class="required">Required</span></label><select id="vehicle_id" name="vehicle_id" required><option value="">Choose a vehicle</option>{% for vehicle in vehicles %}<option value="{{ vehicle.vehicle_id }}" {% if filters.get('vehicle_id')|string == vehicle.vehicle_id|string %}selected{% endif %}>{{ vehicle.make or '' }} {{ vehicle.model or 'Vehicle' }} · {{ vehicle.licence_plate or vehicle.vin }}</option>{% endfor %}</select></div>
  <fieldset class="field arrival-field"><legend>When will you arrive?</legend><div class="arrival-picker"><div><label for="arrival_date">Date</label><input id="arrival_date" name="arrival_date" type="date" value="{{ filters.get('arrival_date', '') }}" aria-describedby="arrival-help" {% if errors.get('arrival_date') %}aria-invalid="true"{% endif %}></div><div><label for="arrival_time">Time</label><input id="arrival_time" name="arrival_time" type="time" step="60" value="{{ filters.get('arrival_time', '') }}" aria-describedby="arrival-help" {% if errors.get('arrival_time') %}aria-invalid="true"{% endif %}></div></div><div class="arrival-zone"><label for="arrival_timezone">Time zone</label><select id="arrival_timezone" name="arrival_timezone">{% for zone,label in arrival_timezones.items() %}<option value="{{ zone }}" {% if filters.get('arrival_timezone', 'America/Vancouver') == zone %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><small class="hint" id="arrival-help">Choose a date and time, or use Search now.</small></fieldset>
</div>
<div class="search-bottom"><details class="advanced"><summary>Search area &amp; status</summary><div class="advanced-grid">{% for key,label in [('west','West longitude'),('south','South latitude'),('east','East longitude'),('north','North latitude')] %}<div class="field"><label for="{{ key }}">{{ label }}</label><input id="{{ key }}" name="{{ key }}" type="number" step="any" value="{{ filters.get(key, '') }}" required></div>{% endfor %}<div class="field"><label for="status">Show stations</label><select id="status" name="status">{% for value,label in [('ALL','All statuses'),('AVAILABLE','Available'),('NEEDS_REVIEW','Needs review'),('UNAVAILABLE','Unavailable')] %}<option value="{{ value }}" {% if filters.get('status') == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div></div></details><div class="search-buttons"><button class="button button-subtle" type="submit" name="search_now" value="1" formnovalidate>Search now</button><button class="button" type="submit">Find stations <span aria-hidden="true">↗</span></button></div></div>
</form>
